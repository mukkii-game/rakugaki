<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セーター3Dスタジオ</title>
<style>
  :root { --bg:#faf7f2; --fg:#2b2622; --muted:#7a6f66; --card:#fff; --line:#e4ddd3; --accent:#c0563f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a18; --fg:#eee7df; --muted:#a89d92; --card:#27231f; --line:#3a342e; --accent:#e07a62; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:1.2rem; }
  header p { margin:2px 0 0; color:var(--muted); font-size:.8rem; }
  header a { color:var(--accent); }
  main { flex:1; display:grid; grid-template-columns: 380px 1fr; min-height:0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: auto 75vh; } }
  aside { padding:16px; border-right:1px solid var(--line); overflow:auto; }
  h2 { font-size:.85rem; margin:18px 0 6px; }
  h2:first-child { margin-top:0; }
  label { display:block; font-size:.75rem; color:var(--muted); margin:8px 0 3px; }
  select, input[type=number] { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); font-size:.9rem; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  button { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); font-size:.85rem; cursor:pointer; }
  button.on { border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #palette { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .sw { position:relative; width:34px; height:34px; border-radius:6px; border:2px solid var(--line); overflow:hidden; cursor:pointer; }
  .sw.on { border-color:var(--accent); outline:2px solid var(--accent); }
  .sw input { position:absolute; inset:auto 0 0 auto; width:14px; height:14px; padding:0; border:0; opacity:0; cursor:pointer; }
  .sw .dot { position:absolute; right:1px; bottom:1px; width:10px; height:10px; border-radius:2px; background:rgba(255,255,255,.85); font-size:8px; line-height:10px; text-align:center; color:#333; pointer-events:none; }
  #chartWrap { overflow:auto; border:1px solid var(--line); border-radius:6px; background:var(--card); padding:6px; }
  #chart { display:block; margin:0 auto; touch-action:none; cursor:crosshair; image-rendering: pixelated; }
  .note { font-size:.75rem; color:var(--muted); margin-top:6px; line-height:1.5; }
  #view { position:relative; min-height:300px; }
  #view canvas { display:block; width:100%; height:100%; }
  #hint { position:absolute; right:10px; bottom:8px; font-size:.75rem; color:var(--muted); pointer-events:none; }
  #info { position:absolute; left:10px; top:8px; font-size:.75rem; color:var(--muted); pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>セーター3Dスタジオ</h1>
  <p>配色の編み図を描くと、セーターに編み込んだ状態を立体で表示します。 <a href="amigurumi.html">→ あみぐるみ（記号編み図）</a></p>
</header>
<main>
  <aside>
    <h2>編み図</h2>
    <label for="preset">サンプル模様</label>
    <select id="preset"></select>
    <div class="tools">
      <button id="toolPen" class="on">✏️ ペン</button>
      <button id="toolFill">🪣 塗りつぶし</button>
      <button id="symK" class="on" title="表目">｜ 表目</button>
      <button id="symP" title="裏目">－ 裏目</button>
      <button id="flipH">↔ 反転</button>
      <button id="clear">クリア</button>
    </div>
    <div id="palette"></div>
    <div id="chartWrap"><canvas id="chart"></canvas></div>
    <div class="grid2">
      <div><label for="cw">模様の幅（目）</label><input id="cw" type="number" min="1" max="60"></div>
      <div><label for="ch">模様の高さ（段）</label><input id="ch" type="number" min="1" max="60"></div>
    </div>
    <p class="note">マス目をクリック／ドラッグで塗ります（色と記号を同時に置きます。「表目／裏目」を切り替えると記号だけ変更することもできます：Shift＋クリック）。色見本をクリックで選択、右下の□で色を変更。編み図は下から上へ編む向きです。</p>

    <h2>セーター</h2>
    <label for="place">模様を入れる場所</label>
    <select id="place">
      <option value="allover">全体（総柄）</option>
      <option value="yoke">ヨーク（丸ヨーク）</option>
      <option value="bands">ヨーク＋裾・袖口のボーダー</option>
      <option value="chest">胸のボーダー</option>
    </select>
    <div class="grid2">
      <div>
        <label for="yarn">糸の太さ</label>
        <select id="yarn">
          <option value="24,32">合太（24目×32段）</option>
          <option value="20,26" selected>並太（20目×26段）</option>
          <option value="15,20">極太（15目×20段）</option>
        </select>
      </div>
      <div>
        <label for="size">サイズ</label>
        <select id="size">
          <option value="88">S（胸囲88cm）</option>
          <option value="100" selected>M（胸囲100cm）</option>
          <option value="112">L（胸囲112cm）</option>
        </select>
      </div>
    </div>
    <p class="note" id="stats"></p>
  </aside>
  <section id="view"><div id="info"></div><div id="hint">ドラッグ: 回転 / ホイール: 拡大 / 右ドラッグ: 移動</div></section>
</main>
<script type="module" src="sweater.js"></script>
</body>
</html>
